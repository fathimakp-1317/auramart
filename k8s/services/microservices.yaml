# ============================================================
# ShopSphere — Microservice Deployments, Services & HPAs
# ============================================================
# Each microservice has:
#   1. Deployment  — runs the container, injects env from Secret/ConfigMap
#   2. Service     — stable ClusterIP DNS name for inter-service calls
#   3. HPA         — auto-scales pods based on CPU (load balancing)
#
# Replace YOUR_REGISTRY with your Docker Hub / GCR / ECR registry.
# Example: docker.io/yourname/shopsphere-auth-service:latest
# ============================================================

# ─────────────────────────────────────────────────────────────
# AUTH SERVICE  (Flask)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shopsphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: YOUR_REGISTRY/shopsphere-auth-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://admin:$(POSTGRES_PASSWORD)@postgres-service:5432/shopsphere"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /hello
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: shopsphere
spec:
  selector:
    app: auth-service
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: shopsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

