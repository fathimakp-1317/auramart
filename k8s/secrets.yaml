# ============================================================
# ShopSphere — Kubernetes Secrets
# ============================================================
# IMPORTANT: Do NOT commit real values to git.
# These are base64-encoded placeholders.
#
# To encode your own values:
#   echo -n "your-secret-here" | base64
#
# To apply with real values:
#   kubectl create secret generic shopsphere-secrets \
#     --from-literal=JWT_SECRET=your-jwt-secret \
#     --from-literal=POSTGRES_PASSWORD=your-db-password \
#     --from-literal=DJANGO_SECRET_KEY=your-django-key \
#     -n shopsphere
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-secrets
  namespace: shopsphere
type: Opaque
data:
  # echo -n "change-me-before-deploy" | base64
  JWT_SECRET:          Y2hhbmdlLW1lLWJlZm9yZS1kZXBsb3k=
  # echo -n "admin" | base64
  POSTGRES_PASSWORD:   YWRtaW4=
  # echo -n "django-insecure-change-me" | base64
  DJANGO_SECRET_KEY:   ZGphbmdvLWluc2VjdXJlLWNoYW5nZS1tZQ==
