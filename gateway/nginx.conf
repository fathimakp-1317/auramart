events {
    worker_connections 1024;
}

http {
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_read_timeout      60s;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location ^~ /auth/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://auth-service:5000/;
        }
        location ^~ /products/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://product-service:8000/;
        }
        location ^~ /orders/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://order-service:8000/;
        }
        location ^~ /cart/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://cart-service:8000/;
        }
        location ^~ /search/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://search-service:8000/;
        }
        location ^~ /recommend/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://recommendation-service:8000/;
        }
        location ^~ /home/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://home-service:8000/;
        }
        location ^~ /notifications/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://notification-api:8000/;
        }
        location ^~ /analytics/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://analytics-service:8000/;
        }
        location ^~ /docs/products {
            proxy_pass http://product-service:8000/docs;
        }
        location ^~ /docs/cart {
            proxy_pass http://cart-service:8000/docs;
        }
        location ^~ /docs/search {
            proxy_pass http://search-service:8000/docs;
        }
        location ^~ /docs/recommend {
            proxy_pass http://recommendation-service:8000/docs;
        }
        location ^~ /docs/home {
            proxy_pass http://home-service:8000/docs;
        }
        location ^~ /docs/notifications {
            proxy_pass http://notification-api:8000/docs;
        }
        location ^~ /docs/analytics {
            proxy_pass http://analytics-service:8000/docs;
        }
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
        location / {
            proxy_pass http://frontend:80;
        }
        error_page 502 503 = @unavailable;
        location @unavailable {
            return 503 '{"error":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}